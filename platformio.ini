; See README.md for the supported boards.

[platformio]
default_envs = promicro, promicro_debug

; Every environment inherits this, whatever the board's default is.
[env]
board_build.f_cpu = 2000000L

[avr]
platform = atmelavr
framework = arduino
; WEATHER_I2C_ADDRESS (optional): the I2C address with the address jumper off, 0x6C if not set. The
; jumper always selects 0x6E.
; WEATHER_I2C_EXTERNAL_PULLUPS: 1 if the I2C bus has its own pull-ups (the internal ones are turned off),
; 0 to keep the internal ones on.
build_flags = -DWEATHER_I2C_EXTERNAL_PULLUPS=1 -include src/NoCoreUsb.h ${this.debug_flags}
debug_flags =

; Prints each second's readings on the debug serial port (src/Board.h), and keeps its USART powered. The
; baud rate has to divide evenly from the 2MHz clock: 250000 is exact, while 115200 and 57600 are about 8%
; off and won't work.
[debug]
debug_flags = -DWEATHER_DEBUG -DWEATHER_DEBUG_BAUD=${this.monitor_speed}
monitor_speed = 250000

; SparkFun Qwiic Pro Micro (the default board) and the 3.3V Pro Micro. The board only picks the upload
; protocol (avr109, Caterina bootloader); the crystal is measured, so the 16MHz board definition serves
; the 8MHz board too.
[env:promicro]
extends = avr
board = sparkfun_promicro16
; The firmware runs without USB (src/NoCoreUsb.h), so there's no serial port to reset the board into its
; bootloader. Double-tap reset first, then upload while the bootloader waits (about 8 seconds).
board_upload.use_1200bps_touch = no
board_upload.wait_for_upload_port = no

[env:promicro_debug]
extends = env:promicro, debug

; Host-side unit tests for lib/WeatherCore: pio test -e native
[env:native]
platform = native
test_framework = unity
