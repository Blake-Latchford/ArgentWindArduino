; Pro Mini 3.3V/8MHz weather interface. The firmware prescales the 8MHz clock to 2MHz before main(), so
; F_CPU is 2MHz for everything that uses it.

[platformio]
default_envs = promini

; Every environment inherits this. The firmware prescales any crystal to 2MHz (ClockPrescale.cpp), so
; F_CPU must say 2MHz whatever the board's default is.
[env]
board_build.f_cpu = 2000000L

[env:promini]
platform = atmelavr
board = pro8MHzatmega328
framework = arduino
; Optiboot takes 512 bytes rather than the stock bootloader's 2K.
board_upload.maximum_size = 32256
; Match the baud rate your Optiboot build was compiled for (commonly 57600 or 115200 at 8MHz). Upload
; speed is unaffected by the prescale, since the bootloader runs at 8MHz.
upload_speed = 57600
; WEATHER_I2C_ADDRESS (optional): the I2C address with the address jumper off, 0x6C if not set. The
; jumper always selects 0x6E.
; WEATHER_I2C_EXTERNAL_PULLUPS: 1 if the I2C bus has its own pull-ups (the internal ones are turned off),
; 0 to keep the internal ones on.
build_flags = -DWEATHER_I2C_EXTERNAL_PULLUPS=1

; Prints each second's readings on the serial port, and keeps USART0 powered. The baud rate has to divide
; evenly from the 2MHz clock: 250000 is exact, while 115200 and 57600 are about 8% off and won't work.
[env:promini_debug]
extends = env:promini
build_flags = ${env:promini.build_flags} -DWEATHER_DEBUG -DWEATHER_DEBUG_BAUD=${this.monitor_speed}
monitor_speed = 250000

; Host-side unit tests for lib/WeatherCore: pio test -e native
[env:native]
platform = native
test_framework = unity
