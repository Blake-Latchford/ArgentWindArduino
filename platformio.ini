; Weather interface firmware. One build per chip: the firmware measures the crystal and prescales it to 2MHz
; before main() (ClockPrescale.cpp), so F_CPU is 2MHz on every board. Environments differ only in upload
; settings. See docs/hardware.md for the supported boards.

[platformio]
; `pio run` builds all of these, so a change for one chip can't silently break another. promicro isn't
; listed until the 32U4 build links (docs/board-support-todo.md, section 2).
default_envs = promini, promini_debug, uno, uno_debug

; Every environment inherits this, whatever the board's default is.
[env]
board_build.f_cpu = 2000000L

[avr]
platform = atmelavr
framework = arduino
; WEATHER_I2C_ADDRESS (optional): the I2C address with the address jumper off, 0x6C if not set. The
; jumper always selects 0x6E.
; WEATHER_I2C_EXTERNAL_PULLUPS: 1 if the I2C bus has its own pull-ups (the internal ones are turned off),
; 0 to keep the internal ones on.
build_flags = -DWEATHER_I2C_EXTERNAL_PULLUPS=1

; Prints each second's readings on the debug serial port (src/Board.h), and keeps its USART powered. The
; baud rate has to divide evenly from the 2MHz clock: 250000 is exact, while 115200 and 57600 are about 8%
; off and won't work.
[debug]
build_flags = ${avr.build_flags} -DWEATHER_DEBUG -DWEATHER_DEBUG_BAUD=${this.monitor_speed}
monitor_speed = 250000

; Pro Mini. FTDI adapter on the serial header.
[env:promini]
extends = avr
board = pro8MHzatmega328
; Optiboot takes 512 bytes rather than the stock bootloader's 2K.
board_upload.maximum_size = 32256
; Match the baud rate your Optiboot build was compiled for (commonly 57600 or 115200 at 8MHz). Upload
; speed is unaffected by the prescale, since the bootloader runs at the crystal frequency.
upload_speed = 57600

[env:promini_debug]
extends = env:promini, debug

; Uno R3 and RedBoard Qwiic: Optiboot at 115200 over USB.
[env:uno]
extends = avr
board = uno

[env:uno_debug]
extends = env:uno, debug

; Pro Micro (3.3V and 5V) and Qwiic Pro Micro. The board only picks the upload protocol (avr109, Caterina
; bootloader); the crystal is measured, so the 16MHz board definition serves the 8MHz boards too.
[env:promicro]
extends = avr
board = sparkfun_promicro16

[env:promicro_debug]
extends = env:promicro, debug

; Host-side unit tests for lib/WeatherCore: pio test -e native
[env:native]
platform = native
test_framework = unity
